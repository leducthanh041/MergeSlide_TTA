# configs/default_tta_core_eval_num_workers0.yaml
# TTA-Core evaluation config — IND forward order, num_workers=0
# Dùng với test_tta_core.py (KHÔNG TCP, KHÔNG L_task, CÓ Module F).

dataset:
  root: "/mmlab_students/storageStudents/nguyenvd/Thanhld/WSI/dataset"

  order: "forward"

  brca:
    csv: "${dataset.root}/wsi_dataset_annotation/tcga_brca/tcga_brca_subset.csv"
    features: "${dataset.root}/TCGA-BRCA_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_brca"

  rcc:
    csv: "${dataset.root}/wsi_dataset_annotation/tcga_rcc/tcga_kidney_subset.csv"
    features: "${dataset.root}/TCGA-RCC_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_rcc"

  nsclc:
    csv: "${dataset.root}/wsi_dataset_annotation/tcga_nsclc/tcga_lung_subset.csv"
    features: "${dataset.root}/TCGA-NSCLC_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_nsclc"

  esca:
    features: "${dataset.root}/TCGA-ESCA_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_esca"

  tgct:
    features: "${dataset.root}/TCGA-TGCT_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_tgct"

  cesc:
    features: "${dataset.root}/TCGA-CESC_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_cesc"

training:
  num_epochs: 10
  lr: 1.0e-5
  weight_decay: 1.0e-4
  seed: 0
  num_folds: 10
  num_tasks: 6

dataloader:
  batch_size: 1
  num_workers: 0

paths:
  finetuned_checkpoints: "./checkpoints/finetuned"
  merged_checkpoints: "./checkpoints/merged"

# ─────────────────────────────────────────────
# TTA-Unified hyperparameters. Nhóm không tiền tố dùng cho naive/task_il;
# nhóm tcp_* dùng riêng cho tcp để hai pipeline có thể tune độc lập.
# ─────────────────────────────────────────────
tta:
  K: 8
  r_patch: 0.75

  tau_ap_ind: 0.92
  tau_ap_ood: 0.70
  beta_ind: 1.2
  beta_ood: 1.5

  spw: 1.0e-6   # CẢNH BÁO: tune cho n_steps=1, CHƯA re-sweep cho n_steps=3 — xem checklist 07_MergeSlide-TTA-Unified.md
  lam_ce: 1.0
  gamma_class: 1.0
  tau_c: 0.3

  # Module D — FIM restore động. ĐÃ CHỌN qua thực nghiệm: TẮT ("no FIM").
  use_fim_restore: false
  delta: 0.1

  eta_base: 0.0005
  tau_ood: 0.7

  ema_alpha: 0.999

  # ── Module F — Consensus-based Sample Selection ────────────────────────
  # S(x) = S_conf(x) * S_agree(x); percentile động theo cửa sổ trượt,
  # reset mỗi khi sang task mới (xem adapter.reset_task_boundary()).
  use_module_f: true
  conf_window: 300
  agree_window: 300
  conf_percentile: 0.5     # giữ 50% slide có H_bar thấp nhất (tự tin hơn)
  agree_percentile: 0.5    # giữ 50% slide có JSD_K thấp nhất (đồng thuận hơn)
  min_window_fill: 30      # chưa đủ 30 slide đầu task -> không gate (tránh suy biến)

  # ── Module G — Multi-step adaptation per slide ─────────────────────────
  # ĐÃ CHỌN qua thực nghiệm: n_steps=3, step_lr_policy="div_n". Các điểm
  # sweep khác (N=1,2,5; step_lr_policy="same") lưu tại configs/ablation/
  # để tái lập bảng ablation cho paper.
  n_steps: 3
  step_lr_policy: "div_n"
  resample_per_step: true

  # SWAG posterior estimation (dùng chung với swag_dir đã train ở bước SWAG)
  swag_epochs: 10
  swag_lr: 1.0e-4

  # ── Module H — Regularizer bám-nguồn ────────────────────────────────────
  # ĐÃ CHỌN qua thực nghiệm: "swag". Phương án "l2_anchor" lưu tại
  # configs/ablation/default_tta_core_l2anchor.yaml.
  regularizer_type: "swag"
  l2_anchor_beta: 1.0        # chỉ dùng khi regularizer_type="l2_anchor"

  # ── TCP legacy pipeline ─────────────────────────────────────────────────
  # Chỉ đọc khi MODE=tcp: DaPC task-conditioned, L_task, prompt EMA và
  # TCP confidence gate. FIM được tắt rõ ràng.
  tcp_K: 8
  tcp_r_patch: 0.75
  tcp_tau_ap_ind: 0.92
  tcp_tau_ap_ood: 0.70
  tcp_beta_ind: 1.2
  tcp_beta_ood: 1.5
  tcp_spw: 1.0e-6
  tcp_lam_ce: 1.0
  tcp_gamma_class: 1.0
  tcp_tau_c: 0.07
  tcp_gamma_task: 0.5
  tcp_margin_task: 0.1
  tcp_use_fim_restore: false
  tcp_delta: 0.03
  tcp_eta_base: 1.0e-4
  tcp_tau_ood: 0.5
  tcp_ema_alpha: 0.999
  tcp_alpha_task_prompt: 0.999
  tcp_delta_margin: 0.10
  tcp_tau_task: 0.70

  # Dùng chung cho cả hai pipeline.
  k_patches_std: 400
