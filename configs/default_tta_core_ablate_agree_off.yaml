# configs/default_tta_core_eval_num_workers0.yaml
# TTA-Core evaluation config — IND forward order, num_workers=0
# Dùng với test_tta_core.py (KHÔNG TCP, KHÔNG L_task, CÓ Module F).

dataset:
  root: "/mmlab_students/storageStudents/nguyenvd/Thanhld/WSI/dataset"

  order: "forward"

  brca:
    csv: "${dataset.root}/wsi_dataset_annotation/tcga_brca/tcga_brca_subset.csv"
    features: "${dataset.root}/TCGA-BRCA_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_brca"

  rcc:
    csv: "${dataset.root}/wsi_dataset_annotation/tcga_rcc/tcga_kidney_subset.csv"
    features: "${dataset.root}/TCGA-RCC_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_rcc"

  nsclc:
    csv: "${dataset.root}/wsi_dataset_annotation/tcga_nsclc/tcga_lung_subset.csv"
    features: "${dataset.root}/TCGA-NSCLC_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_nsclc"

  esca:
    features: "${dataset.root}/TCGA-ESCA_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_esca"

  tgct:
    features: "${dataset.root}/TCGA-TGCT_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_tgct"

  cesc:
    features: "${dataset.root}/TCGA-CESC_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_cesc"

training:
  num_epochs: 10
  lr: 1.0e-5
  weight_decay: 1.0e-4
  seed: 0
  num_folds: 10
  num_tasks: 6

dataloader:
  batch_size: 1
  num_workers: 0

paths:
  finetuned_checkpoints: "./checkpoints/finetuned"
  merged_checkpoints: "./checkpoints/merged"

# ─────────────────────────────────────────────
# TTA-Core Hyperparameters (KHÔNG có task/routing params:
# không tau_task, không gamma_task, không margin_task,
# không alpha_task_prompt, không delta_margin)
# ─────────────────────────────────────────────
tta:
  K: 8
  r_patch: 0.75

  tau_ap_ind: 0.92
  tau_ap_ood: 0.70
  beta_ind: 1.2
  beta_ood: 1.5

  spw: 1.0e-6
  lam_ce: 1.0
  gamma_class: 1.0
  tau_c: 0.3

  # Module D — FIM restore động (mặc định bật)
  use_fim_restore: true
  delta: 0.1

  # Module D' — Fisher regularizer offline (mặc định TẮT — bật để chạy AC-6)
  use_fisher_reg: false
  beta_fisher: 0.0

  eta_base: 0.0005
  tau_ood: 0.7

  ema_alpha: 0.999

  # ── Module F — Consensus-based Sample Selection (MỚI) ─────────────────
  # S(x) = S_conf(x) * S_agree(x); percentile động theo cửa sổ trượt,
  # reset mỗi khi sang task mới (xem adapter.reset_task_boundary()).
  use_module_f: true
  conf_window: 300
  agree_window: 300
  conf_percentile: 0.5     # giữ 50% slide có H_bar thấp nhất (tự tin hơn)
  agree_percentile: 1.0    # TẮT S_agree (AC-9 ablation: CESC cho thấy JSD_K không có tín hiệu)
  min_window_fill: 30      # chưa đủ 30 slide đầu task -> không gate (tránh suy biến)

  # SWAG posterior estimation (dùng chung với swag_dir đã train ở bước SWAG)
  swag_epochs: 10
  swag_lr: 1.0e-4
