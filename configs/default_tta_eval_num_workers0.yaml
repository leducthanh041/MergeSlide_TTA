# configs/default_tta_eval_num_workers0.yaml
# TTA evaluation config — IND forward order, num_workers=0

dataset:
  root: "/mmlab_students/storageStudents/nguyenvd/Thanhld/WSI/dataset"

  order: "forward"

  brca:
    csv: "${dataset.root}/wsi_dataset_annotation/tcga_brca/tcga_brca_subset.csv"
    features: "${dataset.root}/TCGA-BRCA_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_brca"

  rcc:
    csv: "${dataset.root}/wsi_dataset_annotation/tcga_rcc/tcga_kidney_subset.csv"
    features: "${dataset.root}/TCGA-RCC_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_rcc"

  nsclc:
    csv: "${dataset.root}/wsi_dataset_annotation/tcga_nsclc/tcga_lung_subset.csv"
    features: "${dataset.root}/TCGA-NSCLC_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_nsclc"

  esca:
    features: "${dataset.root}/TCGA-ESCA_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_esca"

  tgct:
    features: "${dataset.root}/TCGA-TGCT_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_tgct"

  cesc:
    features: "${dataset.root}/TCGA-CESC_processed/features/"
    splits: "${dataset.root}/wsi_dataset_annotation/tcga_cesc"

training:
  num_epochs: 10
  lr: 1.0e-5
  weight_decay: 1.0e-4
  seed: 0
  num_folds: 10
  num_tasks: 6

dataloader:
  batch_size: 1
  num_workers: 0

paths:
  task_prompts: "./task_prompts.pt"
  finetuned_checkpoints: "./checkpoints/finetuned"
  merged_checkpoints: "./checkpoints/merged"

# ─────────────────────────────────────────────
# TTA Hyperparameters
# ─────────────────────────────────────────────
tta:
  # Module A — WSI Bag Augmentation (Frozen-to-Paraffin)
  K: 8              # số augmented views cho teacher
  r_patch: 0.75     # fraction của K_PATCHES mỗi augmentation

  # Module B — DaPC Pseudo-label Correction
  tau_ap_ind: 0.92  # anchor confidence threshold — IND regime
  tau_ap_ood: 0.70  # anchor confidence threshold — OOD regime
  beta_ind: 1.2     # DaPC sensitivity — IND
  beta_ood: 1.5     # DaPC sensitivity — OOD

  # Module C — PETAL Loss
  spw: 1.0e-6       # Bayesian regularizer weight
  lam_ce: 1.0       # CE weight trong L_PETAL
  gamma_class: 1.0  # L_class weight
  tau_c: 0.07       # temperature scaling cho L_class

  # Module D — FIM Restoration
  delta: 0.03       # quantile: reset bottom 3% FIM params về anchor

  # Module E — Adaptive LR
  eta_base: 1.0e-4  # base learning rate
  tau_ood: 0.5      # sigmoid midpoint cho OOD score

  # EMA
  ema_alpha: 0.999  # teacher EMA momentum

  # Phase 7 — TCP Confidence Gate
  tau_task: 0.70    # min TCP confidence để dùng routing (fallback nếu thấp hơn)

  # SWAG posterior estimation
  swag_epochs: 10
  swag_lr: 1.0e-4